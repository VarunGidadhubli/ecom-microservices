spring.application.name=ecom-gateway
server.port=9090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Order Service
spring.cloud.gateway.server.webflux.routes[0].id=ecom-order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ecom-order-service
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/api/order/**

# Inventory Service
spring.cloud.gateway.server.webflux.routes[1].id=ecom-inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ecom-inventory-service
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/api/inventory/**