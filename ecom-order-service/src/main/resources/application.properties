spring.application.name=ecom-order-service
server.port=8080

logging.level.com.ecom.order.client=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=20

# Rate Limiter
resilience4j.ratelimiter.instances.inventoryService.limit-for-period=2
resilience4j.ratelimiter.instances.inventoryService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.inventoryService.timeout-duration=0

# Sliding Window
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=10

# Minimum calls required to calculate failure rate
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.minimum-number-of-calls=5

# Failure threshold
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=50

# Open state duration
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=10s

# Half-open configuration
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# Automatic transition
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Ignore specific exceptions
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.ignore-exceptions=java.lang.IllegalArgumentException

# Collector to collect all the logs
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

management.tracing.sampling.probability=1.0